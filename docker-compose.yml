services:
  postgres:
    image: postgres:17-alpine
    container_name: inventory-audit-db
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: inventory_local
      POSTGRES_DB: inventory_audit
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
